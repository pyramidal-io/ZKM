[package]
name = "zka_lib"
type = "lib"
authors = ["ZKA Protocol"]
compiler_version = ">=1.0.0"
description = "Shared cryptographic primitives for ZKA Noir circuits"

[dependencies]
# Pinned to noir-lang/poseidon v0.3.0 == commit
# 0880c371e88e583d39515fd3f877538657ac41eb.
# nargo 1.0.0-beta.25 only honors a mutable `tag` for git deps (it silently
# ignores `rev`/`commit` and emits no Nargo.lock), so the immutable commit is
# enforced out-of-band by checking that the tag still points at the commit
# above; the KAT in src/lib.nr also fails loudly if the resulting Poseidon2
# output changes. Keep the tag, commit, and KAT in sync when bumping.
poseidon = { tag = "v0.3.0", git = "https://github.com/noir-lang/poseidon" }
