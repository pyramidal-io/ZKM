[package]
name = "zkm_aztec_lib"
authors = ["ZKM Contributors"]
compiler_version = ">=1.0.0"
type = "lib"

[dependencies]
# aztec-nargo resolves this public tag without a dependency lockfile. The
# fetched checkout is verified after compilation by
# ../scripts/check-aztec-source-integrity.sh (tag, commit, tree, source, and
# LICENCE digests), so the mutable tag cannot silently change the test input.
aztec = { git = "https://github.com/aztec-labs-eng/aztec-nr", tag = "v6.0.0", directory = "aztec" }
zkm_lib = { path = "../../noir/zkm_lib" }
